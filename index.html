<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

    <body class="bg-purple-100 text-gray-800">

    <header class="bg-purple-100 border-b border-purple-200">

        <nav class="flex justify-between items-center px-[50px] py-[20px] max-[600px]:flex-col max-[600px]:gap-[15px]">

            <h1 class="text-2xl font-bold text-purple-700">
                Arabelle Jayme
            </h1>

            <ul class="flex gap-[25px]">

                <li>
                    <a href="#projects" class="hover:text-purple-600">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="#services" class="hover:text-purple-600">
                        Services
                    </a>
                </li>

                <li>
                    <a href="#contact" class="hover:text-purple-600">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <section class="text-center py-[50px] px-[20px]">

        <p class="text-purple-600">
            @_arbljym
        </p>

        <h2 class="text-3xl font-bold text-purple-800 mt-[10px]">
            Hi Welcome!
        </h2>

        <p class="text-gray-600 mt-[10px]">
          
        </p>

        <button id="switch"
            class="bg-pink-600 text-white px-[20px] py-[10px] rounded-[8px] mt-[20px] hover:bg-purple-700">
            Switch
        </button>

    </section>


    <main class="max-w-[950px] mx-auto px-[25px] pb-[50px]">

        <div class="grid grid-cols-2 gap-[25px] max-[700px]:grid-cols-1">


            <section id="projects"
                class="bg-pink border border-pink-200 rounded-[10px] p-[25px]">

                <h2 class="text-xl font-bold text-purple-700 mb-[15px]">
                    My Projects
                </h2>

                <ul class="space-y-[8px]">
                    <li>Personal Portfolio</li>
                    <li>Payroll System</li>
                    <li>Startup Website</li>
                    
                </ul>

            </section>


            <section id="services"
                class="bg-pink border border-pink-200 rounded-[10px] p-[25px]">

                <h2 class="text-xl font-bold text-purple-700 mb-[15px]">
                    My Services
                </h2>

                <ul class="space-y-[8px]">
                    <li>Website Creation</li>
                    <li>System Creation</li>
                
                </ul>

            </section>

        </div>


        <section id="contact"
            class="bg-pink border border-pink-200 rounded-[10px] p-[25px] mt-[25px]">

            <h2 class="text-xl font-bold text-purple-700 mb-[15px]">
                Contact Me
            </h2>

            <form action="#" class="flex flex-col gap-[10px]">

                <label for="name">
                    Name
                </label>

                <input type="text" id="name" name="name"
                    class="border border-pink-200 rounded-[6px] p-[8px]"
                    required>


                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email"
                    class="border border-pink-200 rounded-[6px] p-[8px]"
                    required>


                <label for="message">
                    Message
                </label>

                <textarea id="message" name="message" rows="5"
                    class="border border-pink-200 rounded-[6px] p-[8px]"
                    required></textarea>


                <button type="submit"
                    class="bg-pink-600 text-white py-[10px] rounded-[8px] mt-[5px] hover:bg-purple-700">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer class="bg-purple-100 border-t border-purple-200 text-center py-[20px]">

        <p class="text-gray-600">
            
        </p>

    </footer>

</body>

</html>>
